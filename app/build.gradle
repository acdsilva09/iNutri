plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.inutri'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.inutri"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // CameraX
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/NOTICE",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/NOTICE.txt"
            ]
        }
    }
}

dependencies {
    // Android base
    implementation 'androidx.core:core-ktx:1.13.1'          // ok com projetos Java
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'  // fornece ListenableFuture

    implementation "androidx.recyclerview:recyclerview:1.3.2"



    // Navigation (você usa NavController na MainActivity)
    implementation 'androidx.navigation:navigation-fragment:2.8.3'
    implementation 'androidx.navigation:navigation-ui:2.8.3'

    // Lifecycle para ViewModel/Livedata na tela de captura
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-android:2.9.4'
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:3.0.6'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:1.3.1"

    // Retrofit + Moshi (pode trocar por Gson se preferir)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'

    // Firebase (Auth, Firestore e Storage)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'

    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'com.google.android.gms:play-services-auth:21.1.1'

    implementation 'com.google.mlkit:image-labeling:17.0.9'




    // opcional: analytics
    // implementation 'com.google.firebase:firebase-analytics'

    // WorkManager opcional (upload em background)
    // implementation 'androidx.work:work-runtime:2.9.1'

    // TensorFlow Lite somente se for classificador on-device
    // implementation 'org.tensorflow:tensorflow-lite:2.14.0'

    // Testes
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
